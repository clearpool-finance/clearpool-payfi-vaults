[profile.default]
# Sets the concrete solc version to use
# This overrides the `auto_detect_solc` value
auto_detect_solc = false
evm_version = 'shanghai'
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./" }]
cbor_metadata = true

libs = [
    'lib',
    'node_modules/@layerzerolabs/toolbox-foundry/lib',
    'node_modules',
]

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
plume = "${PLUME_RPC_URL}"
polygon = "${MATIC_RPC_URL}"
bsc = "${BNB_RPC_URL}"
avalanche = "${AVALANCHE_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
optimism = "${OPTIMISM_RPC_URL}"
base = "${BASE_RPC_URL}"
sepolia_main = "${SEPOLIA_RPC_URL}"
sei_devnet = "${SEI_DEVNET_RPC_URL}"
op_sepolia = "${OP_SEPOLIA_RPC_URL}"
poseidon = "${POSEIDON_RPC_URL}"
plasma="${PLASMA_RPC_URL}"
flare="${FLARE_RPC_URL}"

[etherscan]
# Etherscan API V2 (unified multichain endpoint; V1 retired June 2025).
mainnet = { key = "${ETHERSCAN_KEY}", chain = 1, url = "https://api.etherscan.io/v2/api" }
# polygon = { key = "${POLYGONSCAN_KEY}" }
# bsc = { key = "${BSCSCAN_KEY}" }
# avalanche = { key = "${SNOWTRACE_KEY}" }
arbitrum = { key = "${ETHERSCAN_KEY}", chain = 42161, url = "https://api.etherscan.io/v2/api" }
# optimism = { key = "${OPTIMISMSCAN_KEY}" }
base = { key = "${ETHERSCAN_KEY}", chain = 8453, url = "https://api.etherscan.io/v2/api" }
sepolia_main = { key = "${ETHERSCAN_KEY}", chain = 11155111, url = "https://api.etherscan.io/v2/api" }

[fmt]
bracket_spacing = true
int_types = "long"
line_length = 120
multiline_func_header = "all"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
wrap_comments = true
